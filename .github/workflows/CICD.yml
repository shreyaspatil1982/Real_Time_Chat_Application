name: Deploy The Application To Server

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
     - name: chekout the code
       uses: actions/checkout@v4

     - name: login to dockerhub and build image
       uses:  docker/login-action@v3
       with:
         username: ${{secrets.DOCKERHUB_USERNAME}}
         password: ${{secrets.DOCKERHUB_TOKEN}}

     - name: build and push Frontend
       uses: docker/build-push-action@v5
       with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chat-app-frontend:${{github.sha}}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

     - name: Build and Push Backend
       uses: docker/build-push-action@v5
       with:
          context: ./server 
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chat-app-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Copy Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/default.conf" 
          target: "/home/ubuntu/RealtimechatAppConfigFile" 

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_SHA: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PORT: ${{ secrets.PORT }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_SHA, DOCKERHUB_USERNAME, PORT, MONGODB_URI, JWT_SECRET, CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET, CLIENT_URL
          script: |
            
            set -e

            cd /home/ubuntu/RealtimechatAppConfigFile

            # Validate required deployment variables
            test -n "$GITHUB_SHA"
            test -n "$DOCKERHUB_USERNAME"
            test -n "$PORT"
            test -n "$MONGODB_URI"
            test -n "$JWT_SECRET"

            # Pull images using the current commit SHA
            sudo env \
              GITHUB_SHA="$GITHUB_SHA" \
              DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" \
              docker compose pull

            # Start or update the application
            sudo env \
              GITHUB_SHA="$GITHUB_SHA" \
              DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" \
              PORT="$PORT" \
              MONGODB_URI="$MONGODB_URI" \
              JWT_SECRET="$JWT_SECRET" \
              CLOUDINARY_CLOUD_NAME="$CLOUDINARY_CLOUD_NAME" \
              CLOUDINARY_API_KEY="$CLOUDINARY_API_KEY" \
              CLOUDINARY_API_SECRET="$CLOUDINARY_API_SECRET" \
              CLIENT_URL="$CLIENT_URL" \
              docker compose up -d --remove-orphans

        